<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script>
		window.addEventListener("error", function (e) {
			if (/^ResizeObserver loop/.test(e.message || "")) {
				e.stopImmediatePropagation();
				e.preventDefault();
			}
		});
		// Paint in the saved/system theme before CSS loads (no light flash on boot).
		(function () {
			var saved = null;
			try { saved = localStorage.getItem("spike-theme"); } catch (e) {}
			if (saved !== "light" && saved !== "dark") {
				saved = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
			}
			document.documentElement.dataset.bsTheme = saved;
		})();
	</script>
	<title>spike - Java decompiler in your browser</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
	<link rel="stylesheet" href="./style.css" />
	<script type="module" src="./src/main.tsx" defer></script>
</head>
<body>
	<div id="app"></div>
</body>
</html>
