name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write   # upload-pages-artifact
  id-token: write # deploy-pages attestation

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # pinned: bundle/asset format must match local dev

      # engine/ is generated by fetch:engine (not committed). fetch-engine.ts is
      # idempotent, so a cache hit skips the ~2.2 MB JetBrains download; the key
      # changes whenever the fetch script (i.e. its pinned version) changes.
      - uses: actions/cache@v4
        with:
          path: engine
          key: engine-${{ hashFiles('scripts/fetch-engine.ts') }}

      - run: bun scripts/fetch-engine.ts
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build # fetch:engine + bun build -> dist/ (relative asset paths)

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
